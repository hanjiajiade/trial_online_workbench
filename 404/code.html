<script>
        // Simple subtle parallax for background shapes
        document.addEventListener('mousemove', (e) => {
            const shapes = document.querySelectorAll('.fixed .absolute');
            const x = e.clientX / window.innerWidth - 0.5;
            const y = e.clientY / window.innerHeight - 0.5;
            
            shapes.forEach((shape, index) => {
                const speed = (index + 1) * 20;
                shape.style.transform = `translate(${x * speed}px, ${y * speed}px) ${shape.classList.contains('rotate-12') ? 'rotate(12deg)' : shape.classList.contains('rotate-45') ? 'rotate(45deg)' : ''}`;
            });
        });
    </script>
